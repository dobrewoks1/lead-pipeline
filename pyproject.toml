[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-pipeline"
version = "0.1.0"
description = "LLM-конвейер обработки заявок: классификация и извлечение полей через Claude (structured outputs), выгрузка в CSV/XLSX, сводка в Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0,<2",
    "pydantic>=2.7,<3",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lead_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
